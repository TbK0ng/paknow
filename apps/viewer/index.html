<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PAknow — 可追溯价格行为问答</title>
<style>
  :root { --fg:#e6e6e6; --bg:#111418; --surface:#1a1f27; --border:#2a303a; --accent:#4da3ff; --muted:#8b95a3; --graph:#c58cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { margin:0; font-size:18px; }
  header .sub { color:var(--muted); font-size:12px; }
  main { max-width:900px; margin:0 auto; padding:20px 20px 150px; }
  #chat { display:flex; flex-direction:column; gap:16px; }
  .qa { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .q { font-weight:600; margin-bottom:8px; }
  .a { white-space:pre-wrap; line-height:1.65; }
  .shot { display:block; max-width:100%; max-height:280px; border-radius:6px; margin:8px 0 4px; border:1px solid var(--border); }
  .meta { color:var(--muted); font-size:12px; margin-top:10px; }
  .cite { display:block; color:var(--accent); font-size:12px; margin-top:4px; }
  .rewrite { color:var(--muted); font-size:12px; margin-bottom:8px; }
  .graphbox { margin-top:14px; border-top:1px dashed var(--border); padding-top:10px; }
  .graphbox summary { cursor:pointer; color:var(--graph); font-size:12px; }
  .gitem { border-left:2px solid var(--graph); padding:6px 0 6px 10px; margin:8px 0; font-size:12px; color:var(--muted); }
  .gitem b { color:var(--fg); font-weight:600; }
  .gitem .seen { color:var(--graph); }
  #form { position:fixed; left:0; right:0; bottom:0; padding:12px 24px 16px; background:linear-gradient(transparent, var(--bg) 30%); }
  #form .inner { display:flex; gap:8px; align-items:center; max-width:900px; margin:0 auto; width:100%; }
  #input { flex:1; padding:13px; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:8px; font-size:14px; }
  button { padding:12px 20px; background:var(--accent); color:#04121f; border:0; border-radius:8px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #reset { background:transparent; color:var(--muted); border:1px solid var(--border); padding:8px 12px; font-weight:400; }
  #attach { display:flex; align-items:center; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--muted); cursor:pointer; font-size:14px; white-space:nowrap; }
  #attach.hasfile { color:var(--accent); border-color:var(--accent); }
  #filechip { max-width:900px; margin:0 auto 8px; display:none; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--muted); }
  #filechip img { height:44px; border-radius:4px; }
  #filechip button { padding:4px 8px; background:transparent; color:var(--muted); border:1px solid var(--border); font-weight:400; }
</style>
</head>
<body>
<header>
  <div><h1>PAknow</h1><div class="sub">多模态检索 · 证据图谱 · 可追溯出处 · 支持追问与截图分析</div></div>
  <button id="reset" type="button">新对话</button>
</header>
<main>
  <div id="chat"></div>
</main>
<form id="form">
  <div id="filechip">
    <img id="filechipimg" alt="待上传截图" />
    <span id="filechipname"></span>
    <button id="fileclear" type="button">移除</button>
  </div>
  <div class="inner">
    <label id="attach" title="上传截图（可选，PNG/JPG）">
      <input id="file" type="file" accept="image/*" hidden />
      <span id="attachlabel">＋ 截图</span>
    </label>
    <input id="input" placeholder="例如：突破在 5 分钟图上常见吗，什么样的突破才算强？" />
    <button id="btn">提问</button>
  </div>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const btn = document.getElementById('btn');
const reset = document.getElementById('reset');
const fileInput = document.getElementById('file');
const attach = document.getElementById('attach');
const attachLabel = document.getElementById('attachlabel');
const chip = document.getElementById('filechip');
const chipImg = document.getElementById('filechipimg');
const chipName = document.getElementById('filechipname');
const fileClear = document.getElementById('fileclear');

// Dialogue turns sent with the next question; the server rewrites the
// follow-up into a standalone retrieval query before anything is scored.
const history = [];
const MAX_HISTORY = 8;
let pendingPreview = null;

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (pendingPreview) URL.revokeObjectURL(pendingPreview);
  pendingPreview = null;
  if (!f) return clearFile();
  pendingPreview = URL.createObjectURL(f);
  chip.style.display = 'flex';
  chipImg.src = pendingPreview;
  chipName.textContent = f.name + ' · ' + Math.round(f.size / 1024) + ' KB';
  attach.classList.add('hasfile');
  attachLabel.textContent = '已选图';
});

fileClear.addEventListener('click', (e) => { e.preventDefault(); clearFile(); });

function clearFile() {
  fileInput.value = '';
  if (pendingPreview) URL.revokeObjectURL(pendingPreview);
  pendingPreview = null;
  chip.style.display = 'none';
  attach.classList.remove('hasfile');
  attachLabel.textContent = '＋ 截图';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (btn.disabled) return;
  const file = fileInput.files[0];
  const q = input.value.trim() || (file ? '分析这张截图' : '');
  if (!q) return;
  // The card keeps this object URL for the life of the page; hand ownership
  // over before clearFile() so it is not revoked under the rendered image.
  const shot = pendingPreview;
  pendingPreview = null;
  input.value = '';
  btn.disabled = true;

  const qa = document.createElement('div');
  qa.className = 'qa';
  qa.innerHTML = '<div class="q">' + escapeHtml(q) + '</div>' +
    (shot ? '<img class="shot" src="' + shot + '" alt="截图" />' : '') +
    '<div class="a">…</div>';
  chat.appendChild(qa);
  scrollDown();

  try {
    let d;
    if (file) {
      const fd = new FormData();
      fd.append('file', file);
      const url = '/charts?query=' + encodeURIComponent(q) + '&cutoff=0';
      const r = await fetch(url, { method: 'POST', body: fd });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      d = await r.json();
      history.push({ role: 'user', content: '［截图］' + q });
      history.push({ role: 'assistant', content: d.answer || '' });
      clearFile();
    } else {
      const r = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, history: history.slice(-MAX_HISTORY) }),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      d = await r.json();
      history.push({ role: 'user', content: q });
      history.push({ role: 'assistant', content: d.answer || '' });
    }
    if (history.length > MAX_HISTORY * 2) history.splice(0, history.length - MAX_HISTORY * 2);
    qa.innerHTML = renderCard(q, d, shot, Boolean(file));
  } catch (err) {
    qa.innerHTML = '<div class="q">' + escapeHtml(q) + '</div>' +
      (shot ? '<img class="shot" src="' + shot + '" alt="截图" />' : '') +
      '<div class="a">请求失败：' + escapeHtml(String(err)) + '</div>';
  } finally {
    btn.disabled = false;
    input.focus();
    scrollDown();
  }
});

reset.addEventListener('click', () => {
  history.length = 0;
  chat.innerHTML = '';
  clearFile();
  input.focus();
});

function renderCard(q, d, shot, isImage) {
  let html = '<div class="q">' + escapeHtml(q) + '</div>';
  if (shot) html += '<img class="shot" src="' + shot + '" alt="截图" />';
  if (d.rewritten && d.query_used) {
    html += '<div class="rewrite">按上文改写为：' + escapeHtml(d.query_used) + '</div>';
  }
  html += '<div class="a">' + escapeHtml(d.answer || '(无回答)') + '</div>';

  if (d.uncertainty && d.uncertainty.length) {
    html += '<div class="meta">不确定项：' + d.uncertainty.map(escapeHtml).join('；') + '</div>';
  }
  if (d.citations && d.citations.length) {
    html += '<div class="meta">出处：</div>';
    for (const c of d.citations) {
      html += '<span class="cite">· ' + escapeHtml(c.citation || c.evidence_id) + '</span>';
    }
  }
  html += '<div class="meta">' + (isImage ? '截图分析 · ' : '') +
          '意图：' + escapeHtml(d.intent || '') +
          ' · 路由：' + escapeHtml((d.routes || []).join(', ') || '—') +
          ' · 轮次：' + escapeHtml(String(d.rounds ?? '—')) + '</div>';

  const g = d.graph_stats || {};
  if (g.enabled) {
    const entries = d.graph || [];
    html += '<details class="graphbox"' + (entries.length ? ' open' : '') + '>' +
      '<summary>' + escapeHtml(graphSummary(g, entries.length)) + '</summary>';
    for (const e of entries) {
      html += '<div class="gitem">' + graphLine(e) + '</div>';
    }
    html += '</details>';
  } else {
    html += '<div class="meta">图谱扩展：未启用</div>';
  }
  return html;
}

// Stats describe the last round; accumulated entries span every round. A gap
// round with no new seeds reports zeros, so do not print them as totals.
function graphSummary(g, entryCount) {
  const selected = g.selected ?? entryCount;
  const parts = ['图谱扩展：' + selected + ' 条选中'];
  if (g.seeds) parts.push('种子 ' + g.seeds);
  if (g.candidates) parts.push(g.candidates + ' 条候选');
  if (g.tokens) parts.push(g.tokens + ' tokens');
  if (!g.seeds) parts.push('本轮无新增种子');
  if (g.truncated_evidence) parts.push('证据触顶');
  return parts.join(' · ');
}

function graphLine(e) {
  const parts = [];
  const head = [e.from_label, e.to_label].filter(Boolean).join(' → ');
  if (head) parts.push('<b>' + escapeHtml(head) + '</b>');
  else if (e.claim && (e.claim.subject || e.claim.predicate)) {
    parts.push('<b>' + escapeHtml([e.claim.subject, e.claim.predicate].filter(Boolean).join(' → ')) + '</b>');
  }
  if (e.relation) parts.push('[' + escapeHtml(e.relation) + ']');
  if (e.seen_index !== null && e.seen_index !== undefined) {
    parts.push('<span class="seen">已见 [' + escapeHtml(String(e.seen_index)) + ']</span>');
  } else if (e.text) {
    parts.push(escapeHtml(e.text));
  }
  const loc = [];
  if (e.chapter_path && e.chapter_path.length) loc.push(e.chapter_path.join(' → '));
  if (e.pdf_page) loc.push('PDF 第 ' + e.pdf_page + ' 页');
  if (e.printed_page) loc.push('印刷页 ' + e.printed_page);
  if (loc.length) parts.push('（' + escapeHtml(loc.join('，')) + '）');
  return parts.join(' ');
}

function scrollDown() {
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
