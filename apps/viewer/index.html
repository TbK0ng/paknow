<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PAknow — 可追溯价格行为问答</title>
<style>
  :root { --fg:#e6e6e6; --bg:#111418; --surface:#1a1f27; --border:#2a303a; --accent:#4da3ff; --muted:#8b95a3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:18px; }
  header .sub { color:var(--muted); font-size:12px; }
  main { max-width:860px; margin:0 auto; padding:20px; }
  #chat { display:flex; flex-direction:column; gap:16px; }
  .qa { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .q { font-weight:600; margin-bottom:8px; }
  .a { white-space:pre-wrap; line-height:1.6; }
  .meta { color:var(--muted); font-size:12px; margin-top:10px; }
  .cite { display:block; color:var(--accent); font-size:12px; margin-top:4px; }
  #form { display:flex; gap:8px; margin-top:20px; }
  #input { flex:1; padding:12px; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:8px; font-size:14px; }
  button { padding:12px 20px; background:var(--accent); color:#04121f; border:0; border-radius:8px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header><h1>PAknow</h1><div class="sub">多模态检索 · 证据图谱 · 可追溯出处</div></header>
<main>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="例如：双底多头旗形的两个低点必须一样吗？" autofocus />
    <button id="btn">提问</button>
  </form>
</main>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  btn.disabled = true;
  const qa = document.createElement('div');
  qa.className = 'qa';
  qa.innerHTML = '<div class="q">' + escapeHtml(q) + '</div><div class="a">…</div>';
  chat.appendChild(qa);
  try {
    const r = await fetch('/query', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query:q}) });
    const d = await r.json();
    let html = '<div class="a">' + escapeHtml(d.answer || '(无回答)') + '</div>';
    if (d.uncertainty && d.uncertainty.length) {
      html += '<div class="meta">不确定项：' + d.uncertainty.map(escapeHtml).join('；') + '</div>';
    }
    if (d.citations && d.citations.length) {
      html += '<div class="meta">出处：</div>';
      for (const c of d.citations) {
        html += '<span class="cite">· ' + escapeHtml(c.citation || c.evidence_id) + '</span>';
      }
    }
    html += '<div class="meta">意图：' + escapeHtml(d.intent || '') + ' · 路由：' + escapeHtml((d.routes||[]).join(', ')) + '</div>';
    qa.innerHTML = '<div class="q">' + escapeHtml(q) + '</div>' + html;
  } catch (err) {
    qa.innerHTML = '<div class="q">' + escapeHtml(q) + '</div><div class="a">请求失败：' + escapeHtml(String(err)) + '</div>';
  } finally {
    btn.disabled = false;
  }
});

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
