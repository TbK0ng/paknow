# Local hooks only: no remote hook repositories, so installs stay offline.
# Install once per clone after the dev install: `pre-commit install`
repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python scripts/precommit_pytest.py
        language: system
        always_run: true
        pass_filenames: false
      - id: scratch
        name: scratch tracker
        entry: python scripts/check_scratch.py
        language: system
        files: ^\.scratch/
        pass_filenames: false
