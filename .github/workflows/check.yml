name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The full `.[dev]` install is impractical here: it pulls torch,
      # transformers, sentence-transformers and rapidocr (several GB) that the
      # test suite never imports. Install the package itself and the light
      # runtime subset the tests transitively import instead.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "pytest>=8.3" "pytest-asyncio>=0.24" \
            "pyyaml>=6.0" "pydantic>=2.9" "pydantic-settings>=2.5" \
            "sqlalchemy>=2.0" "qdrant-client>=1.10" "numpy>=1.26" \
            "openai>=1.40" "langgraph>=0.2" "langchain-core>=0.3" "jieba>=0.42"

      - name: Scratch tracker
        run: python scripts/check_scratch.py

      - name: Tests
        run: python -m pytest -q
