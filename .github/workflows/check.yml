name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Use a light install: tests stub the PyTorch text encoder and reranker.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "pytest>=8.3" "pytest-asyncio>=0.24" \
            "pyyaml>=6.0" "pydantic>=2.9" "pydantic-settings>=2.5" \
            "sqlalchemy>=2.0" "qdrant-client>=1.19.1" "numpy>=1.26" \
            "portalocker>=3.0" \
            "openai>=1.40" "jieba>=0.42" \
            "fastapi>=0.115" "httpx>=0.27" "beautifulsoup4>=4.12" \
            "pymupdf>=1.24" "lxml>=5.2"

      - name: Scratch tracker
        run: python scripts/check_scratch.py

      - name: Tests
        run: python -m pytest -q
