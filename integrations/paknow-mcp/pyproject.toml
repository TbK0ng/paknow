[project]
name = "paknow-mcp"
version = "0.1.0"
description = "Evidence-first MCP server for the PAknow price-action knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PAknow" }]
keywords = ["mcp", "rag", "price-action", "knowledge-base", "evidence"]
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
paknow-mcp = "paknow_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paknow_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills/paknow/SKILL.md" = "paknow_mcp/skills/paknow/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/paknow_mcp",
  "skills/paknow",
  "tests",
  "scripts",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
