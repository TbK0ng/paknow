[project]
name = "paknow"
version = "0.1.0"
description = "PAknow: multimodal retrieval, evidence graph, verifiable SOP memory system"
requires-python = ">=3.14"
dependencies = [
    # web + contracts
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "openai>=1.40",
    # authoritative metadata db
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # vector index
    "qdrant-client>=1.10",
    # ingest
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rapidocr-onnxruntime>=1.3",
    # ml -- NOTE: torch must be installed from the CUDA index on Windows:
    #   uv pip install --index-url https://download.pytorch.org/whl/cu128 "torch==2.9.1"
    # PyPI's default Windows wheel is CPU-only (+cpu) and lacks Blackwell CUDA.
    "torch==2.9.1",
    "accelerate>=1.0",
    # transformers must stay 5.x (sentence-transformers 6.x requires >=5.0,<6.0).
    # ColQwen2/ColPali late-interaction classes ship in transformers 5.x.
    "transformers>=5.0,<6.0",
    "sentence-transformers>=6.0,<7.0",
    "pillow>=10.0",
    # workflow
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # util
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "xxhash>=3.4",
    "jieba>=0.42",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paknow"]
