[project]
name = "paknow"
version = "0.1.0"
description = "PA Agent: read-only price-action replay with PAknow evidence"
requires-python = ">=3.14"
dependencies = [
    # web + contracts
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "openai>=1.40",
    # authoritative metadata db
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # vector index
    "qdrant-client>=1.19.1",
    "portalocker>=3.0",
    # ingest
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # ml -- NOTE: torch must be installed from the CUDA index on Windows:
    #   uv pip install --index-url https://download.pytorch.org/whl/cu128 "torch==2.9.1"
    # PyPI's default Windows wheel is CPU-only (+cpu) and lacks Blackwell CUDA.
    "torch==2.9.1",
    # Keep transformers on the supported sentence-transformers major version.
    "transformers>=5.0,<6.0",
    "sentence-transformers>=6.0,<7.0",
    # util
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jieba>=0.42",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paknow"]
